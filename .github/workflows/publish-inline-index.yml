name: Publish self-contained landing index

on:
  push:
    paths:
      - .github/workflows/publish-inline-index.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact index.html
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          data = ''''''
          pathlib.Path('index.html').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
      - name: Commit new index and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/publish-inline-index.yml
          git add index.html .github/workflows/publish-inline-index.yml
          git commit -m 'fix: publish self-contained landing page hero'
          git push
