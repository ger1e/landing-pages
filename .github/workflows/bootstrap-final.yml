name: Bootstrap final landing page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-final.yml'
      - 'patches/**'

permissions:
  contents: write

concurrency:
  group: bootstrap-final-landing
  cancel-in-progress: false

jobs:
  build-final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch current production source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            'https://gergoilly.hu/' -o index.html
          test -s index.html
          sha256sum index.html

      - name: Verify expected source build
        shell: bash
        run: |
          set -euo pipefail
          expected='6145cb0a9491d48b1d58a250d5de99696074dbbf7a843804947bef897d51e0b2'
          actual="$(sha256sum index.html | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected live source hash: $actual" >&2
            exit 1
          fi

      - name: Apply verified final patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in patches/01-mobile-css.patch patches/02-audio-viewport.patch patches/03-matrix.patch patches/04-glitch-work.patch patches/05-spotify.patch; do
            echo "Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done
          expected='8313646752632450f1d812a54cd6c84200d85a57c99e6df519c454743eef4201'
          actual="$(sha256sum index.html | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "Patched build hash mismatch: $actual" >&2
            exit 1
          fi

      - name: Install deterministic image optimizer
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'

      - name: Optimize embedded portrait
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64, re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          match = re.search(r'data:image/jpeg;base64,([^"\'\)\s<>]+)', text)
          if not match:
              raise SystemExit('embedded portrait JPEG not found')
          raw = base64.b64decode(match.group(1))
          image = Image.open(BytesIO(raw)).convert('RGB')
          image = image.resize((1600, 1600), Image.Resampling.LANCZOS)
          out = BytesIO()
          image.save(out, 'JPEG', quality=88, optimize=True, progressive=True, subsampling=1)
          encoded = base64.b64encode(out.getvalue()).decode('ascii')
          text = text[:match.start(1)] + encoded + text[match.end(1):]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Static final QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64, re, hashlib

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          assert path.stat().st_size < 700_000, path.stat().st_size
          assert text.count('FINAL-BOUNDED-HARDENING-2026-08-21') >= 2
          assert 'IBM Consulting FutureNow Center' in text
          assert 'This system is for the use of authorized users' not in text
          assert "this.back=this.make($('#matrixBack'),7.8,2.20,.78,false,.72)" in text
          assert "this.front=this.make($('#matrixFront'),9.2,4.30,.90,true,.68)" in text
          assert "function triggerPortraitGlitch(){triggerSyncLines(540)" in text
          assert "spotifyController.resume?.();spotifyController.play?.()" in text
          assert "#workstation.mobile-keyboard .terminal{transform:translate3d" in text
          m = re.search(r'data:image/jpeg;base64,([^"\'\)\s<>]+)', text)
          assert m
          image = Image.open(BytesIO(base64.b64decode(m.group(1))))
          assert image.size == (1600, 1600), image.size
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          assert scripts
          Path('/tmp/site.js').write_text(scripts[-1], encoding='utf-8')
          print('bytes', path.stat().st_size)
          print('sha256', hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          node --check /tmp/site.js
          git diff --check

      - name: Prepare static-host files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'gergoilly.hu' > CNAME
          touch .nojekyll

      - name: Commit final build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CNAME .nojekyll
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy final gergoilly.hu landing page'
          git push
