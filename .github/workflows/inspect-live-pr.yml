name: Inspect live production source

on:
  pull_request:
    branches: [main]
    paths: ['inspect-live.request']

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fetch and extract relevant production code
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors -H 'Cache-Control: no-cache' https://gergoilly.hu/ -o /tmp/live.html
          mkdir -p diagnostics
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          data=Path('/tmp/live.html').read_bytes()
          s=data.decode('utf-8','replace')
          pats=[
            'mobile-keyboard','visualViewport','function beep','triggerPortraitGlitch','triggerWordmarkGlitch',
            'this.back=this.make','this.front=this.make','matrixEngine','else if(lc===\'work\')',
            'spotifyPlay','onSpotifyIframeApiReady','prefers-reduced-motion','beforeinput','keydown',
            'IBM Consulting FutureNow Center','This system is for the use of authorized users'
          ]
          out=[f'sha256={hashlib.sha256(data).hexdigest()}',f'bytes={len(data)}']
          mt=re.search(r'<meta\s+name=["\']build["\'][^>]*>',s,re.I)
          out.append('build_meta='+(mt.group(0) if mt else 'NONE'))
          title=re.search(r'<title>(.*?)</title>',s,re.I|re.S)
          out.append('title='+(title.group(1).strip() if title else 'NONE'))
          for p in pats:
            out.append('\n===== '+p+' =====')
            i=s.find(p)
            if i<0:
              out.append('NOT_FOUND')
            else:
              a=max(0,i-900); b=min(len(s),i+2200)
              out.append(s[a:b])
          Path('diagnostics/live-snippets.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostics to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/live-snippets.txt
          git commit -m 'Inspect current gergoilly.hu source' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
