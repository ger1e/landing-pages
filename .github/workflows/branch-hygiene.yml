name: Branch hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prune-merged:
    name: Prune stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete merged branches and verified build-marker branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          deleted=0
          preserved=0

          while IFS=$'\t' read -r branch protected original_sha; do
            [[ -z "$branch" ]] && continue
            [[ "$branch" == "$DEFAULT_BRANCH" ]] && continue

            if [[ "$protected" == "true" ]]; then
              echo "PRESERVE protected: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            ahead=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$branch" --jq '.ahead_by')
            merged_head=false

            if [[ "$ahead" != "0" ]]; then
              merged_head=$(gh pr list \
                --repo "$REPO" \
                --state merged \
                --head "$branch" \
                --limit 100 \
                --json headRefOid \
                --jq "[.[] | select(.headRefOid == \"$original_sha\")] | length > 0")
            fi

            disposable_marker_branch=false
            if [[ "$branch" == "asset-build" && "$ahead" != "0" && "$merged_head" != "true" ]]; then
              mapfile -t changed_files < <(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$branch" --paginate --jq '.files[].filename')
              if [[ "${#changed_files[@]}" -gt 0 ]]; then
                disposable_marker_branch=true
                for file in "${changed_files[@]}"; do
                  if [[ "$file" != .hero-build/* ]]; then
                    disposable_marker_branch=false
                    break
                  fi
                done
              fi
            fi

            if [[ "$ahead" != "0" && "$merged_head" != "true" && "$disposable_marker_branch" != "true" ]]; then
              echo "PRESERVE unique/unmerged commits ($ahead ahead): $branch"
              preserved=$((preserved + 1))
              continue
            fi

            current_sha=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')
            if [[ "$current_sha" != "$original_sha" ]]; then
              echo "PRESERVE changed during run: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            deleted=$((deleted + 1))

            if [[ "$disposable_marker_branch" == "true" ]]; then
              echo "DELETED verified build-marker branch: $branch"
            elif [[ "$merged_head" == "true" ]]; then
              echo "DELETED exact head of merged PR: $branch"
            else
              echo "DELETED fully merged ancestor: $branch"
            fi
          done < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" \
              --jq '.[] | [.name, .protected, .commit.sha] | @tsv'
          )

          echo "Deleted: $deleted"
          echo "Preserved: $preserved"
