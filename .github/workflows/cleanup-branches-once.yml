name: Cleanup temporary branches once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary branches
        shell: bash
        run: |
          set -euo pipefail
          for b in \
            cleanup-direct-20260821 \
            deploy-final-qa-20260821 \
            pre-cleanup-20260821 \
            pre-final-backup-20260821 \
            publish-final-terminal \
            __noop_check \
            cleanup-refs-20260821 \
            cleanup-runner-20260821
          do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
              git push origin --delete "$b"
            fi
          done
      - name: Remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-branches-once.yml
          git commit -m 'chore: remove one-shot branch cleanup'
          git push origin HEAD:main
