name: Build final terminal site

on:
  pull_request:
    branches: [main]
    paths:
      - 'publish-final.request'
      - 'patches/**'
      - '.github/workflows/build-final-pr.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch canonical source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors -H 'Cache-Control: no-cache' https://gergoilly.hu/ -o index.html
          expected='6145cb0a9491d48b1d58a250d5de99696074dbbf7a843804947bef897d51e0b2'
          actual="$(sha256sum index.html | awk '{print $1}')"
          echo "source=$actual"
          test "$actual" = "$expected"

      - name: Apply verified QA patches
        shell: bash
        run: |
          set -euo pipefail
          for p in patches/01-mobile-css.patch patches/02-audio-viewport.patch patches/03-matrix.patch patches/04-glitch-work.patch patches/05-spotify.patch; do
            git apply --check "$p"
            git apply "$p"
          done
          expected='8313646752632450f1d812a54cd6c84200d85a57c99e6df519c454743eef4201'
          actual="$(sha256sum index.html | awk '{print $1}')"
          echo "patched=$actual"
          test "$actual" = "$expected"

      - name: Optimize portrait
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64,re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.search(r'data:image/jpeg;base64,([^"\'\)\s<>]+)',s); assert m
          im=Image.open(BytesIO(base64.b64decode(m.group(1)))).convert('RGB').resize((1600,1600),Image.Resampling.LANCZOS)
          o=BytesIO(); im.save(o,'JPEG',quality=88,optimize=True,progressive=True,subsampling=1)
          b=base64.b64encode(o.getvalue()).decode('ascii')
          p.write_text(s[:m.start(1)]+b+s[m.end(1):],encoding='utf-8')
          PY

      - name: Final static QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64,re,hashlib
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          assert p.stat().st_size < 700000
          assert 'FINAL-BOUNDED-HARDENING-2026-08-21' in s
          assert 'IBM Consulting FutureNow Center' in s
          assert 'This system is for the use of authorized users' not in s
          assert "this.back=this.make($('#matrixBack'),7.8,2.20,.78,false,.72)" in s
          assert "this.front=this.make($('#matrixFront'),9.2,4.30,.90,true,.68)" in s
          assert 'spotifyController.resume?.();spotifyController.play?.()' in s
          assert '#workstation.mobile-keyboard .terminal{transform:translate3d' in s
          m=re.search(r'data:image/jpeg;base64,([^"\'\)\s<>]+)',s); assert m
          assert Image.open(BytesIO(base64.b64decode(m.group(1)))).size==(1600,1600)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I); assert scripts
          Path('/tmp/site.js').write_text(scripts[-1],encoding='utf-8')
          print('bytes',p.stat().st_size)
          print('sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          node --check /tmp/site.js
          git diff --check

      - name: Commit generated site to PR branch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' gergoilly.hu > CNAME
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CNAME .nojekyll
          git commit -m 'Generate final QA gergoilly.hu' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
