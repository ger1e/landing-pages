name: Build final terminal site

on:
  pull_request:
    branches: [main]
    paths:
      - 'payload-cat/**'
      - '.github/workflows/build-final-pr.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct verified final site
        shell: bash
        run: |
          set -euo pipefail
          cat payload-cat/chunk-*.b64 > /tmp/site.b64
          test "$(sha256sum /tmp/site.b64 | awk '{print $1}')" = '97ccf61132e2bd538a101b5b1c9953f71b30a26db825a735f6da5a25a3194db9'
          base64 -d /tmp/site.b64 > /tmp/site.html.gz
          test "$(sha256sum /tmp/site.html.gz | awk '{print $1}')" = '4b4c3c845786965a642df74317746e21f46a2a18073a966ae0e4fdc2c4348c49'
          gzip -dc /tmp/site.html.gz > index.html
          test "$(sha256sum index.html | awk '{print $1}')" = 'f877e7c8c87207b293a33bf538fea060ab3d05ace4b3fd0ff8896d96ed36ccc2'

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          assert p.stat().st_size == 152199
          assert 'FINAL-BOUNDED-HARDENING-2026-08-21-CAT-ASSET' in s
          assert 'IBM Consulting FutureNow Center' in s
          assert 'This system is for the use of authorized users' not in s
          assert "this.back=this.make($('#matrixBack'),7.8,2.20,.78,false,.72)" in s
          assert "this.front=this.make($('#matrixFront'),9.2,4.30,.90,true,.68)" in s
          assert 'spotifyController.resume?.();spotifyController.play?.()' in s
          assert '#workstation.mobile-keyboard .terminal{transform:translate3d' in s
          assert "assets/cat4k/00.txt" in s and "assets/cat4k/01-03.txt" in s and "assets/cat4k/04-07.txt" in s
          assert 'data:image/jpeg;base64,' not in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I); assert scripts
          Path('/tmp/site.js').write_text(scripts[-1],encoding='utf-8')
          print('sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          node --check /tmp/site.js
          git diff --check

      - name: Commit generated site to PR branch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' gergoilly.hu > CNAME
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CNAME .nojekyll
          git commit -m 'Generate final QA gergoilly.hu' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
