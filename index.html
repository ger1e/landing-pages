<!doctype html>
<html lang="en" data-cyber-reset="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050a">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Rotund operator cyberpunk landing experiment.">
<meta property="og:type" content="website">
<meta property="og:title" content="CIGANY.EXE // ROTUND_OPERATOR">
<meta property="og:description" content="HUNT. VERIFY. ENRICH. EXPLAIN.">
<meta name="twitter:card" content="summary_large_image">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/svg+xml" href="assets/radar.svg">
<link rel="stylesheet" href="assets/site.css">
<title>CIGANY.EXE // ROTUND_OPERATOR</title>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="grid" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>
<div class="glitch-band band-a" aria-hidden="true"></div>
<div class="glitch-band band-b" aria-hidden="true"></div>
<div class="glitch-band band-c" aria-hidden="true"></div>
<div class="boot" aria-hidden="true"><span>ROTUND_OPERATOR</span><small>LINKING // 3X SIGNAL</small></div>
<div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

<main class="stage" id="stage">
  <header class="topline">
    <span class="status"><i></i> SIGNAL // LIVE</span>
    <span class="status-copy">EXPERIMENTAL LANDING SURFACE</span>
    <a class="repo-link" href="https://github.com/ger1e/landing-pages" aria-label="Open landing-pages repository">SOURCE ↗</a>
  </header>

  <section class="hero" aria-labelledby="heroTitle">
    <div class="copy" id="copy">
      <p class="eyebrow">// CIGANY.EXE</p>
      <h1 id="heroTitle" data-text="ROTUND_OPERATOR">ROTUND_<br>OPERATOR</h1>
      <p class="mission">HUNT <b>›</b> VERIFY <b>›</b> ENRICH <b>›</b> EXPLAIN</p>
      <p class="sub">NO DASHBOARD. NO BADGE WALL. JUST SIGNAL.</p>
      <div class="controls">
        <button id="soundToggle" class="sound" type="button" aria-pressed="false"><span class="sound-icon">◢</span><span id="soundLabel">SOUND // ARM</span></button>
        <span class="latency">MATRIX_RATE // 3.0X</span>
      </div>
    </div>

    <figure class="operator" id="operator">
      <div class="operator-backdrop" aria-hidden="true"></div>
      <img src="assets/rotund-operator-4k.avif" width="3072" height="4096" fetchpriority="high" decoding="async" alt="Very round fluffy tabby cat at a cyber workstation">
      <div class="monitor-cast" aria-hidden="true"></div>
      <div class="operator-scan" aria-hidden="true"></div>
      <div class="operator-glitch" aria-hidden="true"></div>
      <figcaption><span>ROTUND_OPERATOR</span><b>ACTIVE</b></figcaption>
    </figure>
  </section>

  <footer class="ticker" aria-label="Signal state">
    <span>MODE // HUNT</span><span>VISUAL // CYAN</span><span>RAIN // 3X</span><span>CURSOR // TRIANGLE</span><span>GLITCH // CONTROLLED</span>
  </footer>
</main>

<script src="assets/site.js" defer></script>
</body>
</html>
