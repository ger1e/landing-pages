<style>
:root{
  --bg:#02050a;--panel:#060a10;--panel2:#09111a;--ink:#f4fbff;--muted:#73879a;
  --cyan:#31d9ff;--teal:#43d4c6;--blue:#2f6bff;--green:#73ff8e;
  --line:rgba(49,217,255,.18);--hard:Impact,Haettenschweiler,"Arial Black","Helvetica Neue",sans-serif;
  --mono:"Courier New",ui-monospace,monospace;--mx:0;--my:0
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--mono);overflow-x:hidden;
  background:
    radial-gradient(circle at 82% 38%,rgba(47,107,255,.11),transparent 30rem),
    radial-gradient(circle at 18% 74%,rgba(49,217,255,.06),transparent 28rem),
    linear-gradient(180deg,#02050a,#03070c 72%,#02050a)
}
body:before{
  content:"";position:fixed;inset:0;z-index:80;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);
  opacity:.32;mix-blend-mode:screen
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}

#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.54}
.grid{
  position:fixed;inset:-30%;z-index:0;pointer-events:none;perspective:760px;overflow:hidden;opacity:.45
}
.grid:before{
  content:"";position:absolute;left:-14%;right:-14%;top:50%;height:110%;transform-origin:center top;
  transform:rotateX(69deg) translateY(calc(var(--my)*6px));
  background-image:
    linear-gradient(rgba(49,217,255,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(47,107,255,.075) 1px,transparent 1px);
  background-size:58px 58px;animation:gridRush 1.3s linear infinite;
  mask-image:linear-gradient(to bottom,#000,transparent 88%)
}
@keyframes gridRush{to{background-position:0 58px,58px 0}}

.scan{
  position:fixed;z-index:34;left:-12%;right:-12%;top:-18vh;height:12vh;pointer-events:none;
  background:linear-gradient(transparent,rgba(49,217,255,.025),rgba(49,217,255,.11),transparent);
  mix-blend-mode:screen;animation:scan 1.75s linear infinite
}
@keyframes scan{to{transform:translateY(148vh)}}

.glitchline{
  position:fixed;z-index:35;left:0;right:0;height:1px;pointer-events:none;opacity:0;
  background:rgba(49,217,255,.21);box-shadow:0 0 13px rgba(47,107,255,.24);
  animation:break 1.9s steps(1) infinite
}
.glitchline.a{top:26%}.glitchline.b{top:66%;animation-delay:-.7s}.glitchline.c{top:84%;animation-delay:-1.3s}
@keyframes break{
  0%,91%,100%{opacity:0;transform:translateX(0) scaleX(1)}
  92%{opacity:.9;transform:translateX(6%) scaleX(.72)}
  93%{opacity:.3;transform:translateX(-3%) scaleX(.9)}
}

.boot{
  position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:#010307;pointer-events:none;
  animation:boot .56s cubic-bezier(.7,0,.3,1) .25s forwards
}
.boot strong{
  display:block;font:italic 900 clamp(42px,8vw,92px)/.8 var(--hard);letter-spacing:-.08em;
  transform:skewX(-12deg);text-shadow:5px 0 rgba(49,217,255,.4),-3px 0 rgba(47,107,255,.42)
}
.boot small{display:block;margin-top:16px;font:10px var(--mono);letter-spacing:.2em;color:var(--cyan)}
@keyframes boot{to{opacity:0;visibility:hidden;clip-path:inset(0 0 100%)}}

.shell{position:relative;z-index:3;width:min(1280px,calc(100% - 30px));margin:auto}
.nav{
  height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.13em;color:var(--muted)
}
.brand,.navright{display:flex;align-items:center;gap:11px}.brand{color:#d9f8ff}
.dot{
  width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 15px var(--cyan);
  animation:dot .62s steps(2) infinite
}
@keyframes dot{50%{opacity:.42;transform:scale(.72)}}
.navright{gap:18px}.navright a:hover{color:var(--cyan)}

.hero{min-height:calc(100vh - 64px);padding:clamp(34px,6vh,70px) 0 42px;display:flex;align-items:center}
.hero-card{
  width:100%;position:relative;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(7,12,19,.91),rgba(2,6,11,.72));
  box-shadow:0 28px 90px rgba(0,0,0,.36);
  padding:clamp(26px,4.5vw,58px)
}
.hero-card:before{content:"";position:absolute;inset:10px;border:1px solid rgba(49,217,255,.045);pointer-events:none}
.hero-card:after{
  content:"";position:absolute;left:-32%;top:-25%;width:16%;height:155%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(49,217,255,.12),rgba(47,107,255,.07),transparent);
  transform:skewX(-16deg);animation:sweep 1.3s cubic-bezier(.65,0,.35,1) infinite;mix-blend-mode:screen
}
@keyframes sweep{0%,14%{left:-32%}72%,100%{left:128%}}

.hero-grid{
  position:relative;z-index:4;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);
  gap:clamp(28px,5vw,72px);align-items:center
}
.content{min-width:0}
.kicker{font-size:10px;letter-spacing:.22em;color:var(--cyan);margin-bottom:20px;animation:flick 1.6s steps(1) infinite}
@keyframes flick{0%,94%,100%{opacity:1}95%{opacity:.42;text-shadow:7px 0 rgba(47,107,255,.5)}96%{opacity:1}}

.name{
  margin:0;display:inline-block;max-width:100%;white-space:nowrap;
  font:italic 900 clamp(48px,7.3vw,104px)/.78 var(--hard);letter-spacing:-.08em;
  transform:skewX(-11deg);color:#f6fcff;
  text-shadow:4px 0 rgba(49,217,255,.42),-4px 0 rgba(47,107,255,.45),0 0 32px rgba(49,217,255,.09);
  position:relative
}
.name:before,.name:after{content:attr(data-t);position:absolute;inset:0;pointer-events:none}
.name:before{color:var(--cyan);clip-path:inset(12% 0 70%);animation:g1 .92s steps(1) infinite}
.name:after{color:var(--blue);clip-path:inset(72% 0 8%);animation:g2 .72s steps(1) infinite}
@keyframes g1{0%,80%,100%{opacity:0}81%{opacity:.78;transform:translate(9px,-2px)}84%{opacity:.22;transform:translate(-4px,1px)}}
@keyframes g2{0%,66%,100%{opacity:0}67%{opacity:.68;transform:translate(-8px,2px)}70%{opacity:.22;transform:translate(4px,-1px)}}

.role{margin-top:24px;font:italic 900 clamp(23px,2.8vw,37px)/.9 var(--hard);letter-spacing:-.05em;text-transform:uppercase}
.role b{color:var(--cyan)}
.copyline{margin-top:13px;font-size:11px;line-height:1.6;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:28px}
.btn{
  display:inline-block;border:1px solid rgba(49,217,255,.38);padding:14px 18px;
  background:linear-gradient(90deg,rgba(47,107,255,.12),rgba(49,217,255,.08));
  font:italic 900 18px/1 var(--hard);text-transform:uppercase;transition:.15s
}
.btn:hover{transform:translate(-2px,-2px);border-color:var(--cyan);box-shadow:0 0 28px rgba(49,217,255,.12)}
.microstate{font-size:9px;letter-spacing:.12em;color:#5f7488;text-transform:uppercase}

.spotify{margin-top:24px;width:min(480px,100%);border:1px solid rgba(49,217,255,.14);background:rgba(2,7,12,.72);padding:10px}
.spotify .cap{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 3px 8px;
  font-size:8px;letter-spacing:.14em;color:#60778c;text-transform:uppercase
}
.spotify .cap b{color:var(--cyan);font-weight:400}
.spotify iframe{display:block;width:100%;height:152px;border:0;border-radius:8px;background:#111}

.flow{margin-top:22px;display:flex;gap:15px;flex-wrap:wrap;font-size:9px;letter-spacing:.11em;color:#60778c;text-transform:uppercase}
.flow b{color:var(--cyan);font-weight:400}

.cat-card{
  position:relative;justify-self:end;width:min(490px,100%);aspect-ratio:3/4;overflow:hidden;
  border:1px solid rgba(49,217,255,.17);background:#03070b;
  box-shadow:0 22px 65px rgba(0,0,0,.38),0 0 38px rgba(47,107,255,.05);
  transform:translate3d(calc(var(--mx)*5px),calc(var(--my)*3px),0)
}
.cat-card:before{content:"";position:absolute;inset:9px;z-index:4;border:1px solid rgba(49,217,255,.06);pointer-events:none}
.cat-card img{
  width:100%;height:100%;display:block;object-fit:contain;object-position:center;
  filter:saturate(.96) contrast(1.04) brightness(.94);
  transform:scale(1.005);animation:catFloat 2.2s ease-in-out infinite;transform-origin:center 58%
}
@keyframes catFloat{0%,100%{transform:translate3d(-1px,2px,0) scale(1.005)}50%{transform:translate3d(3px,-3px,0) scale(1.018)}}
.cat-glow{
  position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(circle at 18% 44%,rgba(82,255,137,.18),transparent 28%),
    linear-gradient(92deg,rgba(68,255,130,.07),transparent 44%);
  animation:glowDrift 1.8s ease-in-out infinite alternate
}
@keyframes glowDrift{
  0%{transform:translate3d(-3%,1%,0) scale(.98);opacity:.52;filter:blur(.2px)}
  50%{transform:translate3d(2%,-2%,0) scale(1.02);opacity:.78;filter:blur(1px)}
  100%{transform:translate3d(5%,2%,0) scale(1.04);opacity:.58;filter:blur(.4px)}
}
.cat-card:after{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,rgba(49,217,255,.025) 50%,transparent 72%);
  animation:catScan 1.1s linear infinite
}
@keyframes catScan{from{transform:translateX(-90%)}to{transform:translateX(90%)}}
.cat-label{
  position:absolute;z-index:5;left:15px;bottom:14px;border:1px solid rgba(49,217,255,.18);
  background:rgba(2,7,12,.82);padding:9px 11px;font-size:8px;letter-spacing:.13em;color:#6e8396;text-transform:uppercase
}
.cat-label b{color:var(--cyan);font-weight:400}
.signal{position:absolute;z-index:5;right:15px;top:14px;font-size:8px;letter-spacing:.13em;color:var(--green);text-shadow:0 0 10px rgba(115,255,142,.35)}
.cat-load{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9px;letter-spacing:.15em;color:var(--cyan);background:rgba(2,7,12,.72);border:1px solid var(--line);padding:9px 11px;pointer-events:none}
.cat-card.ready .cat-load{display:none}

@media(max-width:930px){
  .hero{align-items:flex-start}.hero-grid{grid-template-columns:1fr}.cat-card{justify-self:end;width:min(470px,100%)}
}
@media(max-width:620px){
  .shell{width:calc(100% - 16px)}.navright a:first-child{display:none}.hero{padding-top:20px}
  .hero-card{padding:26px 20px 22px}.name{font-size:clamp(40px,12.4vw,60px)}.role{font-size:24px}
  .cat-card{justify-self:stretch;width:100%}.microstate{display:none}
}
@media(prefers-reduced-motion:reduce){
  #matrix,.grid,.scan,.glitchline,.boot{display:none!important}
  *,*:before,*:after{animation:none!important;scroll-behavior:auto!important}
  .cat-card{transform:none!important}
}

<body>
<div class="boot" aria-hidden="true"><div><strong>CIGANY.EXE</strong><small>SIGNAL ONLINE</small></div></div>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="grid" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<i class="glitchline a" aria-hidden="true"></i><i class="glitchline b" aria-hidden="true"></i><i class="glitchline c" aria-hidden="true"></i>

<div class="shell">
  <nav class="nav" aria-label="Primary">
    <div class="brand"><i class="dot" aria-hidden="true"></i><span>GER1E // ONLINE</span></div>
    <div class="navright">
      <a href="https://github.com/ger1e" rel="me">GITHUB</a>

    </div>
  </nav>

  <main class="hero">
    <section class="hero-card" aria-labelledby="hero-title">
      <div class="hero-grid">
        <div class="content">
          <div class="kicker">// CIGANY.EXE / SIGNAL_ACQUIRED</div>
          <h1 id="hero-title" class="name" data-t="ム乇 尺 1 乇">ム乇 尺 1 乇</h1>
          <div class="role">HUNT / <b>CTI</b> / DETECT</div>
          <div class="copyline">Behavior. Evidence. Signal.</div>
          <div class="actions">
            <a class="btn" href="https://github.com/ger1e" rel="me">ACCESS GIT</a>
            <span class="microstate">THREAT HUNTING // INTELLIGENCE // DETECTION</span>
          </div>

          <div class="spotify">
            <div class="cap"><span>// NIGHT SIGNAL</span><b>SPOTIFY</b></div>
            <iframe src="https://open.spotify.com/embed/track/2kPmvDatzh3OjcCiBPsurw?utm_source=generator&theme=0"
              title="Spotify track player" loading="lazy"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

          <img id="hero-cat" width="3072" height="4096"
            alt="Very round fluffy tabby cat at a cyber workstation" decoding="async">
          <div class="cat-load" id="cat-load" aria-live="polite">4K // LOADING</div>
          <div class="cat-glow" aria-hidden="true"></div>

<script>

(async()=>{
  const img=document.getElementById('hero-cat');
  const card=img.closest('.cat-card');
  const state=document.getElementById('cat-load');
  const parts=['assets/cat4k/00.txt','assets/cat4k/01-03.txt','assets/cat4k/04-07.txt'];
  try{
    const payload=(await Promise.all(parts.map(async p=>{
      const r=await fetch(p,{cache:'force-cache'});
      if(!r.ok) throw new Error(`asset ${r.status}`);
      return (await r.text()).trim();
    }))).join('');
    const raw=atob(payload),bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([bytes],{type:'image/webp'}));
    img.onload=()=>{card.classList.add('ready');state.textContent='4K // ONLINE';};
    img.onerror=()=>{state.textContent='ASSET // RETRY';};
    img.src=url;
  }catch(e){state.textContent='ASSET // RETRY';}
})();

(()=>{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root=document.documentElement;
  if(!reduce){
    addEventListener('pointermove',e=>{
      root.style.setProperty('--mx',((e.clientX/innerWidth)-.5).toFixed(3));
      root.style.setProperty('--my',((e.clientY/innerHeight)-.5).toFixed(3));
    },{passive:true});
  }

  const c=document.getElementById('matrix'),x=c.getContext('2d',{alpha:true});
  if(!x||reduce)return;
  const chars='01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&*+<>/';
  let w=0,h=0,dpr=1,cols=[],last=0;
  const font=15;
  function resize(){
    dpr=Math.min(devicePixelRatio||1,1.5);
    w=innerWidth;h=innerHeight;
    c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
    c.style.width=w+'px';c.style.height=h+'px';
    x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.ceil(w/font);
    cols=Array.from({length:n},(_,i)=>cols[i]??{y:Math.random()*-h,v:165+Math.random()*150,a:.12+Math.random()*.27});
  }
  resize();addEventListener('resize',resize,{passive:true});

  function draw(t){
    const dt=Math.min((t-last)/1000,.05)||.016;last=t;
    x.fillStyle='rgba(2,5,10,.17)';x.fillRect(0,0,w,h);
    x.font=`${font}px ${getComputedStyle(document.documentElement).getPropertyValue('--mono')}`;
    x.textAlign='center';
    for(let i=0;i<cols.length;i++){
      const p=cols[i],ch=chars[(Math.random()*chars.length)|0];
      const r=Math.random();
      x.fillStyle=r<.05?`rgba(115,255,142,${p.a*.72})`:r<.55?`rgba(49,217,255,${p.a})`:`rgba(47,107,255,${p.a*.9})`;
      x.fillText(ch,i*font+font/2,p.y);
      p.y+=p.v*dt*3;
      if(p.y>h+40){p.y=-Math.random()*h*.7;p.v=165+Math.random()*150}
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
