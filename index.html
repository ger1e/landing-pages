<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<title>ム乇 尺 1 乇 // ger1e</title>
<style>html,body{margin:0;min-height:100%;background:#03050a;color:#58dcff;font:11px/1.4 "Courier New",monospace}body{display:grid;place-items:center}#boot{letter-spacing:.16em}</style>
</head>
<body><div id="boot">CIGANY.EXE // BOOTING</div>
<script>
(async()=>{
  const src='https://raw.githubusercontent.com/ger1e/landing-pages/main/.github/workflows/publish-inline-index.yml';
  const y=await fetch(src,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});
  const m=y.match(/data = '''([A-Za-z0-9+/=]+)'''/s);if(!m)throw new Error('payload');
  if(!('DecompressionStream' in self))throw new Error('gzip');
  const u=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));
  const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
})().catch(()=>{document.getElementById('boot').textContent='BOOT ERROR // REFRESH';});
</script>
</body>
</html>
